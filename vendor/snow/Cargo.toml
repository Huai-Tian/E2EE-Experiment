# Vendored fork of snow 0.10.0 (upstream: github.com/mcginty/snow),
# patched via [patch.crates-io] from the workspace root.
#
# The ONLY delta vs upstream (P1 memory hygiene, E2EE-Experiment):
#   1. zeroize dependency (below) + lints.rust unsafe_code allow
#      (upstream forbids unsafe; the Kyber1024 secret-key wipe needs it)
#   2. SymmetricStateData derives ZeroizeOnDrop (h/ck chain secrets)
#   3. HandshakeState.psks → Zeroizing (PSK = our SPAKE2 ignition key;
#      also kills the per-token Copy that left stack residue upstream)
#   4. Drop impls in resolvers/default.rs: Dh25519/P256 privkey wipe,
#      Kyber1024 secret-key volatile wipe (pqcrypto field is private)
# Cipher internals (ChaCha20Poly1305) already zeroize via the upstream
# chacha20poly1305 0.10 → chacha20/zeroize feature chain — untouched.
# Behavior is bit-identical; snow's own test suite ships in this copy.

[package]
edition = "2024"
rust-version = "1.85"
name = "snow"
version = "0.10.0"
authors = [
    "Jake McGinty <me@jakebot.org>",
    "trevp",
]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A pure-rust implementation of the Noise Protocol Framework"
homepage = "https://github.com/mcginty/snow"
documentation = "https://docs.rs/snow/"
readme = "README.md"
keywords = [
    "noise",
    "protocol",
    "crypto",
]
categories = ["cryptography"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/mcginty/snow"

[package.metadata.docs.rs]
all-features = false
features = ["ring-resolver"]
no-default-features = false

[badges.travis-ci]
branch = "master"
repository = "mcginty/snow"

[features]
default = [
    "default-resolver",
    "default-resolver-crypto",
    "std",
]
default-resolver = []
default-resolver-crypto = [
    "use-aes-gcm",
    "use-chacha20poly1305",
    "use-blake2",
    "use-sha2",
    "use-curve25519",
    "use-getrandom",
]
hfs = []
nightly = [
    "blake2/simd_opt",
    "subtle/nightly",
]
pqclean_kyber1024 = ["use-pqcrypto-kyber1024"]
ring-accelerated = [
    "ring-resolver",
    "default-resolver",
    "std",
]
ring-resolver = [
    "ring",
    "std",
]
risky-raw-split = []
std = [
    "getrandom/std",
    "subtle/std",
    "ring/std",
    "blake2/std",
    "sha2/std",
]
use-aes-gcm = [
    "aes-gcm",
    "default-resolver",
]
use-blake2 = [
    "blake2",
    "default-resolver",
]
use-chacha20poly1305 = [
    "chacha20poly1305",
    "default-resolver",
]
use-curve25519 = [
    "curve25519-dalek",
    "default-resolver",
]
use-getrandom = [
    "getrandom",
    "default-resolver",
]
use-p256 = [
    "p256",
    "default-resolver",
]
use-pqcrypto-kyber1024 = [
    "pqcrypto-kyber",
    "pqcrypto-traits",
    "hfs",
    "default-resolver",
]
use-sha2 = [
    "sha2",
    "default-resolver",
]
use-xchacha20poly1305 = [
    "chacha20poly1305",
    "default-resolver",
]
vector-tests = []
xchachapoly = ["use-xchacha20poly1305"]

[lib]
name = "snow"
path = "src/lib.rs"

[[example]]
name = "oneway"
path = "examples/oneway.rs"

[[example]]
name = "simple"
path = "examples/simple.rs"

[[test]]
name = "general"
path = "tests/general.rs"

[[test]]
name = "vectors"
path = "tests/vectors.rs"

[[bench]]
name = "benches"
path = "benches/benches.rs"
harness = false

[dependencies.aes-gcm]
version = "0.10"
features = ["aes"]
optional = true
default-features = false

[dependencies.blake2]
version = "0.10"
optional = true
default-features = false

[dependencies.chacha20poly1305]
version = "0.10"
optional = true
default-features = false

[dependencies.curve25519-dalek]
version = "4.1.3"
optional = true
default-features = false

[dependencies.getrandom]
version = "0.3"
optional = true

[dependencies.p256]
version = "0.13.2"
features = ["ecdh"]
optional = true

[dependencies.pqcrypto-kyber]
version = "0.8"
optional = true

[dependencies.pqcrypto-traits]
version = "0.3"
optional = true

[dependencies.ring]
version = "0.17.12"
optional = true

[dependencies.sha2]
version = "0.10"
optional = true
default-features = false

[dependencies.subtle]
version = "2.4"
default-features = false

[dependencies.zeroize]
version = "1"
default-features = false
features = ["derive"]

[dev-dependencies.criterion]
version = "0.6"

[dev-dependencies.hex]
version = "0.4"

[dev-dependencies.rand_core]
version = "0.9"
default-features = false

[dev-dependencies.serde]
version = "1.0"

[dev-dependencies.serde_derive]
version = "1.0"

[dev-dependencies.serde_json]
version = "1.0"

[dev-dependencies.x25519-dalek]
version = "2.0"

[build-dependencies.rustc_version]
version = "0.4"

[lints.clippy]
as_conversions = "warn"
doc_markdown = "allow"
missing_assert_message = "warn"
missing_asserts_for_indexing = "warn"
shadow_reuse = "warn"
std_instead_of_core = "warn"
unseparated_literal_suffix = "warn"
used_underscore_items = "allow"

[lints.clippy.pedantic]
level = "warn"
priority = -1

# fork delta: upstream forbids unsafe; the Kyber1024 secret-key wipe
# (resolvers/default.rs) needs a volatile pointer write — the same
# technique the zeroize crate itself uses internally.
[lints.rust]
unsafe_code = "allow"

[profile.test]
opt-level = 1
[workspace]
