name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux：构建 + 全量测试（干净环境里的回归防线）。
  # 判例注入测试需要 rogue feature（settled 2026-10-16）：缺 feature 时
  # canary 测试恰一条响亮失败——静默跳过=罪，所以 CI 必须带上 feature。
  # 默认构建（不带 feature）在上面的 build 步骤验证：编译期零注入符号。
  # CI 红迹修复（rulings.2026_10_17_ci_debug_budget_mismatch）：测试对齐
  # 项目验证形态跑 release；事件预算经环境旋钮放宽到 45s（2 核共享
  # runner 的调度压力——预算是环境校准非断言语义，默认 15s 不变）。
  test-linux:
    runs-on: ubuntu-latest
    env:
      E2EE_TEST_EVENT_BUDGET_MS: "45000"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo build --verbose
      - run: cargo test --release --verbose --features rogue

  # Windows：你日常开发在 Windows，双向都不许回归
  # （release + 45s 预算——同 test-linux 的红迹修复。）
  test-windows:
    runs-on: windows-latest
    env:
      E2EE_TEST_EVENT_BUDGET_MS: "45000"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo build --verbose
      - run: cargo test --release --verbose --features rogue

  # musl 静态构建：验证 release 产物形态永远可构建
  musl-static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
